apiVersion: v1
kind: Service            # headless: identidad de red estable del StatefulSet
metadata: { name: postgres-headless, namespace: microrred-bi }
spec:
  clusterIP: None
  selector: { app: postgres }
  ports: [ { name: pg, port: 5432 } ]
---
apiVersion: v1
kind: Service            # ClusterIP: ETL, simulador y Grafana lo encuentran como "postgres"
metadata: { name: postgres, namespace: microrred-bi, labels: { app: postgres } }
spec:
  type: ClusterIP
  selector: { app: postgres }
  ports: [ { name: pg, port: 5432, targetPort: 5432 } ]
---
apiVersion: apps/v1
kind: StatefulSet
metadata: { name: postgres, namespace: microrred-bi }
spec:
  serviceName: postgres-headless
  replicas: 1
  selector: { matchLabels: { app: postgres } }
  template:
    metadata: { labels: { app: postgres } }
    spec:
      containers:
        - name: postgres
          image: postgres:16.4
          ports: [ { containerPort: 5432 } ]
          env:
            - { name: PGDATA, value: /var/lib/postgresql/data/pgdata }
            - name: POSTGRES_USER
              valueFrom: { secretKeyRef: { name: bi-credentials, key: POSTGRES_USER } }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: bi-credentials, key: POSTGRES_PASSWORD } }
            - name: POSTGRES_DB
              valueFrom: { secretKeyRef: { name: bi-credentials, key: POSTGRES_DB } }
            - name: BI_LECTURA_PASSWORD
              valueFrom: { secretKeyRef: { name: bi-credentials, key: BI_LECTURA_PASSWORD } }
          volumeMounts:
            - { name: data, mountPath: /var/lib/postgresql/data }
            - { name: init, mountPath: /docker-entrypoint-initdb.d, readOnly: true }
          readinessProbe:
            exec: { command: ["sh", "-c", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"] }
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec: { command: ["sh", "-c", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"] }
            initialDelaySeconds: 30
            periodSeconds: 10
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits:   { cpu: "1",  memory: 1Gi }
      volumes:
        - name: init
          configMap: { name: postgres-init, defaultMode: 493 }   # 493 = 0755 (ejecutable)
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: ["ReadWriteOnce"]
        resources: { requests: { storage: 5Gi } }

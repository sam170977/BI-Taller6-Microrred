apiVersion: v1
kind: Service
metadata: { name: grafana, namespace: microrred-bi, labels: { app: grafana } }
spec:
  type: ClusterIP
  selector: { app: grafana }
  ports: [ { name: http, port: 3000, targetPort: 3000 } ]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: grafana, namespace: microrred-bi }
spec:
  replicas: 1
  selector: { matchLabels: { app: grafana } }
  template:
    metadata: { labels: { app: grafana } }
    spec:
      containers:
        - name: grafana
          image: grafana/grafana-oss:11.3.0
          ports: [ { containerPort: 3000 } ]
          env:
            - { name: GF_AUTH_ANONYMOUS_ENABLED, value: "false" }
            - { name: GF_USERS_ALLOW_SIGN_UP, value: "false" }
            - name: GF_SECURITY_ADMIN_PASSWORD
              valueFrom: { secretKeyRef: { name: bi-credentials, key: GF_SECURITY_ADMIN_PASSWORD } }
            - name: BI_LECTURA_PASSWORD
              valueFrom: { secretKeyRef: { name: bi-credentials, key: BI_LECTURA_PASSWORD } }
          volumeMounts:
            - { name: ds,     mountPath: /etc/grafana/provisioning/datasources }
            - { name: prov,   mountPath: /etc/grafana/provisioning/dashboards }
            - { name: alerts, mountPath: /etc/grafana/provisioning/alerting }
            - { name: dash,   mountPath: /var/lib/grafana/dashboards }
          readinessProbe:
            httpGet: { path: /api/health, port: 3000 }
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /api/health, port: 3000 }
            initialDelaySeconds: 30
            periodSeconds: 10
          resources:
            requests: { cpu: 100m, memory: 192Mi }
            limits:   { cpu: 500m, memory: 512Mi }
      volumes:
        - { name: ds,     configMap: { name: grafana-datasources } }
        - { name: prov,   configMap: { name: grafana-dashboard-provider } }
        - { name: alerts, configMap: { name: grafana-alerting } }
        - { name: dash,   configMap: { name: grafana-dashboards } }
